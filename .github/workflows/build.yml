name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Read version
        id: meta
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauri = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoLine = Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $cargoLine) { throw "Could not read version from src-tauri/Cargo.toml" }
          $cargo = $cargoLine.Matches.Groups[1].Value
          if (-not $pkg -or $pkg -ne $tauri -or $pkg -ne $cargo) {
            throw "Version mismatch: package.json=$pkg tauri.conf.json=$tauri Cargo.toml=$cargo. Run npm run set-version -- x.y.z so all three match."
          }
          "version=$pkg" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Version $pkg"

      - name: Decide whether to build or publish
        id: gate
        shell: pwsh
        run: |
          $event = "${{ github.event_name }}"
          $build = $false
          $publish = $false

          if ($event -eq "pull_request") {
            $build = $true
            Write-Host "Pull request — build only."
          } else {
            git rev-parse --verify HEAD^ 2>$null | Out-Null
            if ($LASTEXITCODE -ne 0) {
              $build = $true
              $publish = $true
              Write-Host "Initial commit — build and publish."
            } else {
              $files = @(git diff --name-only HEAD^ HEAD) | ForEach-Object { $_ -replace '\\', '/' }
              $releasePaths = @(
                "package.json",
                "src-tauri/tauri.conf.json",
                "src-tauri/Cargo.toml",
                "CHANGELOG.md"
              )
              $hit = $files | Where-Object { $releasePaths -contains $_ }
              if ($hit) {
                $build = $true
                $publish = $true
                Write-Host "Version or changelog changed ($($hit -join ', ')) — build and publish."
              } else {
                Write-Host "No version bump in this push — skipping build and release."
              }
            }
          }

          "build=$build" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "publish=$publish" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Skipped
        if: steps.gate.outputs.build != 'true'
        run: echo "Skipped — bump the version (and CHANGELOG) to ship a new release."

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.build == 'true' || steps.gate.outputs.publish == 'true'
        with:
          node-version: 20
          cache: npm

      - name: Extract patch notes
        if: steps.gate.outputs.publish == 'true'
        run: node scripts/extract-release-notes.mjs ${{ steps.meta.outputs.version }} release-notes.md

      - name: Install Rust
        if: steps.gate.outputs.build == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        if: steps.gate.outputs.build == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - if: steps.gate.outputs.build == 'true'
        run: npm ci

      - if: steps.gate.outputs.build == 'true'
        run: npx tauri build

      - name: Upload exe
        if: steps.gate.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: 7tv-emote-copier-windows-v${{ steps.meta.outputs.version }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/7tv-emote-copier.exe

      - name: Publish GitHub Release
        if: steps.gate.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: 7TV Emote Copier v${{ steps.meta.outputs.version }}
          body_path: release-notes.md
          target_commitish: ${{ github.sha }}
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/7tv-emote-copier.exe
